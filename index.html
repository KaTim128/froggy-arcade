<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Froggy Arcade</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d12'/%3E%3Ccircle cx='10' cy='11' r='5' fill='%233FE39B'/%3E%3Ccircle cx='22' cy='11' r='5' fill='%233FE39B'/%3E%3Crect x='5' y='12' width='22' height='16' rx='7' fill='%233FE39B'/%3E%3Ccircle cx='16' cy='23' r='7' fill='%23FCDC3C'/%3E%3Ccircle cx='10' cy='11' r='2.4' fill='%23111'/%3E%3Ccircle cx='22' cy='11' r='2.4' fill='%23111'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: ui-monospace, "Courier New", monospace;
      }
      /* PRD AR-1 / SM-3: the letterbox bars are simply the black page behind
         an integer-scaled canvas. Never stretch. */
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      /* PRD FR-2 / SM-4: Froggy's overlay sits ABOVE the scaled pixel buffer and
         is never routed through it. Smooth rendering, explicitly. */
      #froggy-layer {
        position: absolute;
        pointer-events: none;
        image-rendering: auto !important;
        z-index: 10;
      }
      #debug-panel {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
        display: none;
        max-height: 100vh;
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(8, 10, 14, 0.94);
        border-right: 1px solid #3fe39b;
        border-bottom: 1px solid #3fe39b;
        color: #cfe;
        font: 11px/1.5 ui-monospace, "Courier New", monospace;
        width: 250px;
      }
      #debug-panel h3 {
        margin: 8px 0 4px;
        font-size: 10px;
        letter-spacing: 1px;
        color: #3fe39b;
        text-transform: uppercase;
      }
      #debug-panel button {
        font: inherit;
        margin: 1px;
        padding: 2px 5px;
        background: #1b2430;
        color: #cfe;
        border: 1px solid #3a4a5c;
        cursor: pointer;
      }
      #debug-panel button:hover { background: #26333f; border-color: #3fe39b; }
      #debug-panel input[type="number"], #debug-panel select {
        font: inherit; background: #1b2430; color: #cfe;
        border: 1px solid #3a4a5c; width: 100%; padding: 2px;
      }
      #debug-panel .row { display: flex; gap: 4px; align-items: center; margin: 2px 0; }
      #debug-panel .dim { color: #7a8b9c; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="debug-panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
